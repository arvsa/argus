name: Deploy to Staging

on:
  workflow_run:
    workflows:
      - Test Backend
      - Test pingsvc
    types:
      - completed
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    steps:
      - name: Verify all required workflows passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_run fires independently per listed workflow, not once
          # all of them complete - so explicitly check every required
          # workflow's latest conclusion for this exact commit before
          # treating CI as green.
          required=("Test Backend" "Test pingsvc")
          for name in "${required[@]}"; do
            conclusion=$(gh run list --repo "$REPO" --commit "$SHA" --json name,conclusion \
              --jq ".[] | select(.name == \"$name\") | .conclusion" | head -n1)
            if [ "$conclusion" != "success" ]; then
              echo "Required workflow '$name' has not succeeded yet (conclusion: ${conclusion:-none}) for $SHA"
              exit 1
            fi
          done
          echo "All required workflows passed for $SHA"

  # Builds on a native arm64 GitHub-hosted runner (no QEMU) since the target
  # EC2 instance is Graviton (t4g.*, matching the region/arch convention
  # already used for ECR elsewhere in this project's history).
  build-and-push:
    needs: check-ci-status
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Compute image tag
        id: vars
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-backend:${{ steps.vars.outputs.image_tag }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-frontend:${{ steps.vars.outputs.image_tag }}
      - name: Build and push pingsvc
        uses: docker/build-push-action@v6
        with:
          context: ./pingsvc
          file: pingsvc/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-pingsvc:${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: [check-ci-status, build-and-push]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build-and-push.outputs.image_tag }}
      ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Copy compose.yml to the box
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: compose.yml
          target: /home/deploy/code/app
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            # ECR tokens expire ~12h, so log in fresh on every deploy. The
            # instance's own IAM instance profile supplies the credentials
            # here -- no static AWS keys ever touch the box.
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
              docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"
            cd /home/deploy/code/app
            # Only the image tag/registry flow through CI on every deploy;
            # the rest of .env is a persistent, one-time-bootstrapped secret
            # file on the box (see deployment.md).
            grep -q '^TAG=' .env && sed -i "s#^TAG=.*#TAG=${{ env.TAG }}#" .env || echo "TAG=${{ env.TAG }}" >> .env
            grep -q '^DOCKER_IMAGE_BACKEND=' .env && sed -i "s#^DOCKER_IMAGE_BACKEND=.*#DOCKER_IMAGE_BACKEND=${{ env.ECR_REGISTRY }}/argus-backend#" .env || echo "DOCKER_IMAGE_BACKEND=${{ env.ECR_REGISTRY }}/argus-backend" >> .env
            grep -q '^DOCKER_IMAGE_FRONTEND=' .env && sed -i "s#^DOCKER_IMAGE_FRONTEND=.*#DOCKER_IMAGE_FRONTEND=${{ env.ECR_REGISTRY }}/argus-frontend#" .env || echo "DOCKER_IMAGE_FRONTEND=${{ env.ECR_REGISTRY }}/argus-frontend" >> .env
            grep -q '^DOCKER_IMAGE_PINGSVC=' .env && sed -i "s#^DOCKER_IMAGE_PINGSVC=.*#DOCKER_IMAGE_PINGSVC=${{ env.ECR_REGISTRY }}/argus-pingsvc#" .env || echo "DOCKER_IMAGE_PINGSVC=${{ env.ECR_REGISTRY }}/argus-pingsvc" >> .env
            # --profile client: redis/pingsvc only start under this profile
            # (see compose.yml); this preserves the existing single-stack
            # deployment's behavior of always running the local ping pipeline.
            docker compose -f compose.yml --project-name "${{ env.STACK_NAME }}" --profile client pull
            docker compose -f compose.yml --project-name "${{ env.STACK_NAME }}" --profile client up -d
