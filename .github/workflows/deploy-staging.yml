name: Deploy to Staging

on:
  workflow_run:
    workflows:
      - Test Backend
      - Test pingsvc
    types:
      - completed
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    steps:
      - name: Verify all required workflows passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_run fires independently per listed workflow, not once
          # all of them complete - so explicitly check every required
          # workflow's latest conclusion for this exact commit before
          # treating CI as green.
          required=("Test Backend" "Test pingsvc")
          for name in "${required[@]}"; do
            conclusion=$(gh run list --repo "$REPO" --commit "$SHA" --json name,conclusion \
              --jq ".[] | select(.name == \"$name\") | .conclusion" | head -n1)
            if [ "$conclusion" != "success" ]; then
              echo "Required workflow '$name' has not succeeded yet (conclusion: ${conclusion:-none}) for $SHA"
              exit 1
            fi
          done
          echo "All required workflows passed for $SHA"

  # Builds on a native arm64 GitHub-hosted runner (no QEMU) since the target
  # EC2 instance is Graviton (t4g.*, matching the region/arch convention
  # already used for ECR elsewhere in this project's history).
  build-and-push:
    needs: check-ci-status
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Compute image tag
        id: vars
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-backend:${{ steps.vars.outputs.image_tag }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-frontend:${{ steps.vars.outputs.image_tag }}
      - name: Build and push pingsvc
        uses: docker/build-push-action@v6
        with:
          context: ./pingsvc
          file: pingsvc/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/argus-pingsvc:${{ steps.vars.outputs.image_tag }}

  # Fully AWS-managed: no SSH, no self-hosted runner, no box to reach into.
  # Renders the freshly-pushed image tags into ecs/staging-taskdef.json (one
  # pass per container that carries one of our images -- prestart and
  # backend both run the argus-backend image), then registers the new task
  # definition revision and updates the ECS service, waiting for it to
  # stabilize.
  deploy:
    needs: [check-ci-status, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Render backend image into prestart container
        id: render-prestart
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/staging-taskdef.json
          container-name: prestart
          image: ${{ needs.build-and-push.outputs.ecr_registry }}/argus-backend:${{ needs.build-and-push.outputs.image_tag }}
      - name: Render backend image into backend container
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-prestart.outputs.task-definition }}
          container-name: backend
          image: ${{ needs.build-and-push.outputs.ecr_registry }}/argus-backend:${{ needs.build-and-push.outputs.image_tag }}
      - name: Render frontend image
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ needs.build-and-push.outputs.ecr_registry }}/argus-frontend:${{ needs.build-and-push.outputs.image_tag }}
      - name: Render pingsvc image
        id: render-pingsvc
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          container-name: pingsvc
          image: ${{ needs.build-and-push.outputs.ecr_registry }}/argus-pingsvc:${{ needs.build-and-push.outputs.image_tag }}
      - name: Register task definition and update service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-pingsvc.outputs.task-definition }}
          service: argus-client
          cluster: argus-staging
          wait-for-service-stability: true
